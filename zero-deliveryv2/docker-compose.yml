# Zero Delivery — stack local completo: `docker compose up -d --build`
# Puertos 3001/5433 para convivir con vocero-crm (3000/5432).
services:
  postgres:
    image: postgres:16-alpine
    container_name: zero-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zero_delivery}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - zd_pgdata:/var/lib/postgresql/data
      # Se aplica solo en el primer arranque (volumen vacío)
      - ./drizzle/0000_initial_zero_delivery.sql:/docker-entrypoint-initdb.d/0000_initial_zero_delivery.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zero_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: zero-delivery-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-zero_delivery}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production-32chars}
      DEFAULT_TENANT_SLUG: zero-delivery
      # Integración Vocero CRM (apagada). host.docker.internal = vocero-crm corriendo en el host
      FEATURE_INTEGRATION_VOCERO: ${FEATURE_INTEGRATION_VOCERO:-false}
      VOCERO_BASE_URL: ${VOCERO_BASE_URL:-http://host.docker.internal:3000}
      VOCERO_BOT_API_KEY: ${VOCERO_BOT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"

volumes:
  zd_pgdata:
